# Perfil "h2": executa a API com banco H2 em memória (sem MySQL). Os dados são perdidos ao encerrar a aplicação.
# Para usar: rode com o perfil ativo "h2" (ex: ./mvnw spring-boot:run -Dspring-boot.run.profiles=h2)
spring.datasource.url=jdbc:h2:mem:autoescola3espg;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
