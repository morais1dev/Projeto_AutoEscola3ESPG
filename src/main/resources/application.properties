spring.application.name=AutoEscola3ESPG
server.port=8085
spring.datasource.url=jdbc:mysql://localhost:3306/autoescola3espg?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=fiap

api.security.token.secret=12345678

# WebService externo consumido pela API (consulta de CEP)
api.viacep.url=https://viacep.com.br/ws

# CORS - origens (front-ends) autorizadas, separadas por virgula
api.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000,http://localhost:5500,http://127.0.0.1:5500,http://localhost:4200,http://localhost:5173

# Documentacao automatica (Swagger / OpenAPI) - http://localhost:8085/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
