# Perfil "test": testes automatizados usam banco H2 em memória (modo de compatibilidade MySQL).
# As migrations do Flyway são executadas normalmente nesse banco. Não é necessário ter MySQL instalado.
spring.datasource.url=jdbc:h2:mem:autoescola3espg_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
